name: acme-salary-management

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # The image's superuser doubles as the owner role (migrations, seed, tests).
      POSTGRES_USER: acme_owner
      POSTGRES_PASSWORD: acme_owner_local
      POSTGRES_DB: acme
    ports:
      # Host 55432 avoids clashing with other local PostgreSQL instances on 5432.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_owner -d acme"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
